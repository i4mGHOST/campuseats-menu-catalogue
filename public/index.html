<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusEats Catalogue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>CampusEats Catalogue</h1>
  <p class="sub">The menu &mdash; served by a REST API (Node + Express)</p>
  
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('', event)">All Items</button>
    <button class="filter-btn" onclick="setFilter('true', event)">Veg Only</button>
    <button class="filter-btn" onclick="setFilter('false', event)">Non-Veg Only</button>
  </div>

  <div id="list">Loading&hellip;</div>

  <form id="addForm">
    <h3>Add a dish</h3>
    <input id="name" placeholder="Dish name" required>
    <input id="price" type="number" placeholder="Price (rupees)">
    <select id="veg">
      <option value="true">Vegetarian</option>
      <option value="false">Non-Vegetarian</option>
    </select>
    <button type="submit">Add dish</button>
  </form>

  <script>
    let currentVegFilter = '';

    function setFilter(vegVal, event) {
      currentVegFilter = vegVal;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      load();
    }

    // 1. READ: GET /items with optional query filter
    async function load() {
      try {
        let url = '/items';
        if (currentVegFilter !== '') {
          url += `?veg=${currentVegFilter}`;
        }
        const res = await fetch(url);
        const items = await res.json();
        
        if (items.length === 0) {
          document.getElementById('list').innerHTML = '<p style="color: #64748b;">No dishes found.</p>';
          return;
        }

        document.getElementById('list').innerHTML = items.map(i => `
          <div class="dish">
            <div class="dish-info">
              <span class="name">${i.name}</span>
              <span class="badge ${i.veg ? 'veg' : 'nonveg'}">${i.veg ? 'Veg' : 'Non-Veg'}</span>
              <span class="price">&#8377;${i.price}</span>
            </div>
            <button class="delete-btn" onclick="deleteItem(${i.id})">Delete</button>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('list').innerHTML = 'Failed to load menu.';
      }
    }

    // DELETE: DELETE /items/:id
    async function deleteItem(id) {
      await fetch(`/items/${id}`, {
        method: 'DELETE'
      });
      load();
    }

    // 2. WRITE: the form POSTS a new dish, then refreshes the list
    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const price = document.getElementById('price').value;
      const veg = document.getElementById('veg').value === 'true';

      await fetch('/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price, veg })
      });

      e.target.reset();
      load();
    });

    // Initial load on page start
    load();
  </script>

</body>
</html>
